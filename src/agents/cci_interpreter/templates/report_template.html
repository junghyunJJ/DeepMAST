<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        /* Dark theme styling for CCI Analysis Report */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(26, 26, 46, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            padding: 40px;
        }

        h1 {
            color: #64ffda;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            font-size: 1.2em;
            margin-bottom: 40px;
            font-style: italic;
        }

        h2 {
            color: #64ffda;
            font-size: 2em;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #64ffda;
        }

        h3 {
            color: #ffd166;
            font-size: 1.5em;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        h4 {
            color: #ff6b9d;
            font-size: 1.2em;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .analysis-section {
            background: rgba(35, 35, 60, 0.6);
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border-left: 4px solid #64ffda;
        }

        .figure-container {
            text-align: center;
            margin: 30px 0;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 10px;
        }

        .figure-container img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(100, 255, 218, 0.3);
        }

        .figure-caption {
            color: #aaa;
            font-style: italic;
            margin-top: 15px;
            font-size: 0.95em;
        }

        .interpretation {
            background: rgba(100, 255, 218, 0.1);
            padding: 20px;
            border-left: 4px solid #64ffda;
            border-radius: 5px;
            margin: 20px 0;
        }

        .interpretation h4 {
            color: #64ffda;
            margin-bottom: 10px;
        }

        .key-findings {
            background: rgba(255, 107, 157, 0.1);
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }

        .key-findings ul {
            list-style-position: inside;
            margin-left: 20px;
        }

        .key-findings li {
            margin: 10px 0;
            color: #e4e4e4;
        }

        .summary-box {
            background: linear-gradient(135deg, rgba(100, 255, 218, 0.1) 0%, rgba(255, 107, 157, 0.1) 100%);
            padding: 25px;
            border-radius: 10px;
            margin: 30px 0;
            border: 2px solid rgba(100, 255, 218, 0.3);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
            border-bottom: 2px solid #64ffda;
            padding-bottom: 10px;
        }

        .tab-button {
            background: rgba(35, 35, 60, 0.8);
            color: #64ffda;
            border: 2px solid #64ffda;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 5px 5px 0 0;
            transition: all 0.3s ease;
            font-size: 1.1em;
            font-weight: 500;
        }

        .tab-button:hover {
            background: rgba(100, 255, 218, 0.2);
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: rgba(100, 255, 218, 0.3);
            border-bottom-color: transparent;
        }

        .tab-content {
            display: none;
            padding: 20px 0;
        }

        .tab-content.active {
            display: block;
        }

        .confidence-bar {
            background: rgba(100, 100, 100, 0.3);
            border-radius: 10px;
            height: 10px;
            margin: 5px 0;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b9d, #64ffda);
            border-radius: 10px;
        }

        .reference {
            color: #64ffda;
            text-decoration: none;
            font-weight: bold;
        }

        .reference:hover {
            text-decoration: underline;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: rgba(35, 35, 60, 0.6);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
            padding: 12px;
            text-align: left;
            font-weight: bold;
            border-bottom: 2px solid #64ffda;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(100, 255, 218, 0.1);
        }

        tr:hover {
            background: rgba(100, 255, 218, 0.05);
        }

        .score-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .score-high {
            background: rgba(100, 255, 218, 0.3);
            color: #64ffda;
        }

        .score-medium {
            background: rgba(255, 209, 102, 0.3);
            color: #ffd166;
        }

        .score-low {
            background: rgba(255, 107, 157, 0.3);
            color: #ff6b9d;
        }

        .paper-card {
            background: rgba(30, 30, 50, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 3px solid #64ffda;
        }

        .paper-title a {
            color: #64ffda;
            text-decoration: none;
        }

        .paper-title a:hover {
            text-decoration: underline;
        }

        .metadata {
            color: #666;
            font-size: 0.9em;
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(100, 255, 218, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <p class="subtitle">{{ subtitle }}</p>

        <!-- Executive Summary -->
        <div class="summary-box">
            <h2>Executive Summary</h2>
            {{ executive_summary }}
        </div>

        <!-- Analysis Configuration -->
        <div class="analysis-section">
            <h3>Analysis Configuration</h3>
            {{ analysis_config }}
        </div>

        <!-- Tabs Navigation -->
        <div class="tabs">
            <button class="tab-button active" onclick="showTab('part1')">Part 1: Spatial & Pathway</button>
            <button class="tab-button" onclick="showTab('part2')">Part 2: CCI & NMF</button>
            <button class="tab-button" onclick="showTab('part3')">Part 3: L-R Interactions</button>
            <button class="tab-button" onclick="showTab('summary')">Comprehensive Summary</button>
        </div>

        <!-- Part 1 Content -->
        <div id="part1" class="tab-content active">
            {{ part1_content }}
        </div>

        <!-- Part 2 Content -->
        <div id="part2" class="tab-content">
            {{ part2_content }}
        </div>

        <!-- Part 3 Content -->
        <div id="part3" class="tab-content">
            {{ part3_content }}
        </div>

        <!-- Summary Content -->
        <div id="summary" class="tab-content">
            {{ summary_content }}
        </div>

        <!-- Metadata -->
        <div class="metadata">
            <p>Generated by DeepMAST CCI Interpreter (Deep Agents)</p>
            <p>Date: {{ generation_date }}</p>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }
    </script>
</body>
</html>
