name: mcpservers

services:
  biomcp:
    build: ./biomcp
    container_name: biomcp-server
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; req=urllib.request.Request('http://localhost:8000/mcp', headers={'Accept':'text/event-stream'}); urllib.request.urlopen(req, timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  sequentialthinking:
    build: ./sequentialthinking
    container_name: sequentialthinking-server
    ports:
      - "8001:8001"
    restart: unless-stopped
