[project]
name = "deepmast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "cellcharter>=0.3.5",
    "cellxgene-census>=1.17.0",
    "chembl-webresource-client>=0.10.9",
    "decoupler>=2.1.3",
    "deepagents==0.5.3",
    "docker>=7.1.0",
    "ipykernel>=7.1.0",
    "ipython>=9.9.0",
    "langchain>=1.2.2",
    "langchain-google-genai>=4.1.3",
    "langchain-mcp-adapters>=0.2.1",
    "langchain-ollama>=1.0.1",
    "langchain-openai>=1.1.7",
    "langgraph>=1.0.5",
    "langgraph-api==0.7.70", # Upgrade to supported 0.7.x server line
    "langgraph-cli>=0.4.11",
    "liana>=1.6.1",
    "omnipath>=1.0.12",
    "scanpy>=1.11.5",
    "squidpy>=1.7.0",
    "sse-starlette>=3.0.0,<3.4.0", # Required by langgraph-api 0.7.70
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "api: live external API connectivity tests (may be slow, requires network)",
    "llm: tests that require a live LLM call (excluded from deterministic CI)",
]

[tool.ruff]
# Keep project-wide defaults loose; opt in to B023 as a regression guard
# after a loop-variable leak at stage_logic.py (deep-dive `track` field was
# assigned from a stale `row` variable — see fix/drug-target-pipeline-errors
# commit "derive deep-dive track from gene-level classification").
target-version = "py312"

[tool.ruff.lint]
select = ["B023"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
